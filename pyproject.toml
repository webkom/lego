[project]
name = "lego"
version = "1.0.0"
description = "Backend for abakus.no"
authors = [{ name = "Webkom", email = "webkom@abakus.no" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "django==5.2.17",
    "ipython==8.29.0",
    "psycopg2-binary==2.9.6",
    "pyyaml==6.0.1",
    "redis==4.5.5",
    "hiredis==2.2.3",
    "celery>=5.4,<6",
    "stripe==3.4.0",
    "boto3==1.28.1",
    "beautifulsoup4==4.12.2",
    "bleach==6.4.0",
    "requests==2.33.0",
    "ldap3==2.9.1",
    "google-api-python-client>=2.155.0,<3",
    "google-auth>=2.37.0,<3",
    "libthumbor==2.0.2",
    "django-health-check==3.20.0",
    "djangorestframework==3.16.1",
    "drf-jwt==1.19.2",
    "djangorestframework-camel-case==1.4.2",
    "drf-spectacular==0.30.0",
    "drf-spectacular-sidecar==2026.8.1",
    "django-extensions==4.1",
    "django-oauth-toolkit==1.6.3",
    "django-cors-headers==4.9.0",
    "django-mptt==0.18.0",
    "django-filter==24.3",
    "django-environ==0.14.0",
    "django-redis==6.0.0",
    "django-ipware==5.0.0",
    "django-phonenumber-field[phonenumberslite]==8.5.0",
    "django-push-notifications==3.0.0",
    #
    # Logging/errors
    "structlog==21.5.0",
    "structlog-sentry==1.4.0",
    "sentry-sdk==2.68.0",
    #
    # channels
    "channels[daphne]==4.3.2",
    "channels-redis==4.1.0",
    #
    # Ical-export
    "django-ical==1.9.1",
    "icalendar==7.2.2",
    #
    # Email
    "aiosmtpd==1.4.6",
    "premailer==3.10.0",
    #
    # Docs
    "Pygments==2.20.0",
    "Markdown==3.8.1",
    "authlib>=1.6.12,<2",
    "weasyprint>=68.0,<69",
    "matplotlib>=3.9.2,<4",
    "django-expo-notifications>=0.7.0,<0.8",
]

[dependency-groups]
dev = ["django-debug-toolbar==4.1.0", "tblib>=1.7.0,<2"]
coverage = ["coverage==7.4.1"]
mypy = [
    "mypy==1.15.0",
    "mypy-extensions==1.0.0",
    "django-stubs==5.2.0",
    "djangorestframework-stubs==3.16.0",
    "types-bleach==6.1.0.0",
    "types-docutils==0.20.0.1",
    "types-Markdown==3.4.2.9",
    "types-python-slugify==8.0.0.3",
    "types-PyYAML==6.0.12.10",
    "types-requests==2.31.0.1",
    "types-six==1.16.21.8",
    "types-urllib3==1.26.25.13",
    "types-python-dateutil==2.8.19.13",
]
formatting = ["black==26.3.1", "isort==5.12.0"]
flake8 = [
    "flake8==6.0.0",
    "flake8-bugbear==23.3.23",
    "flake8-comprehensions==3.10.1",
    "flake8-print>=5.0.0,<6",
]
docs = ["sphinx==6.2.1", "sphinx_rtd_theme==1.2.1"]
prod = ["uwsgi==2.0.22", "flower==1.2.0"]


[tool.uv]
# LEGO is an application, not a distributable package. It is imported from the
# source tree via PYTHONPATH, so there is nothing to build or install.
package = false


[tool.django-stubs]
django_settings_module = "lego.settings"


[tool.isort]
profile = "black"
skip_gitignore = true
default_section = "THIRDPARTY"
known_first_party = "lego"
known_django = ["django", "rest_framework", "django_filters"]
sections = [
    "FUTURE",
    "STDLIB",
    "DJANGO",
    "THIRDPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER",
]
combine_as_imports = true


[tool.flake8]
config_file = ".flake8"


