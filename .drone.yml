---
kind: pipeline
type: docker
name: default

trigger:
  event:
    exclude:
      - pull_request

steps:
  - name: setup
    image: abakus/lego-testbase:python3.11
    when:
      event: push
    environment:
      LANG: C.UTF-8
    commands:
      - make ci_settings

  - name: missing-migrations
    image: abakus/lego-testbase:python3.11
    when:
      event: push
    environment:
      LANG: C.UTF-8
      DJANGO_SETTINGS_MODULE: lego.settings
      PYTHONPATH: /drone/src
      DATABASE: database
      CACHE: cache
    depends_on:
      - setup
    commands:
      - pip install -q uv==0.11.6
      - uv run --frozen --no-default-groups python manage.py migrate
      - uv run --frozen --no-default-groups python manage.py missing_migrations

  - name: tests
    image: abakus/lego-testbase:python3.11
    when:
      event: push
    environment:
      LANG: C.UTF-8
      DJANGO_SETTINGS_MODULE: lego.settings
      # sitecustomize.py is at the repo root and is what starts coverage in the
      # subprocesses spawned by --parallel. Both of these are load-bearing.
      PYTHONPATH: /drone/src
      COVERAGE_PROCESS_START: /drone/src/.coveragerc
      DATABASE: database
      CACHE: cache
    depends_on:
      - setup
    commands:
      - pip install -q uv==0.11.6
      - uv run --frozen --no-default-groups --group coverage
        coverage run --source=lego manage.py test --parallel

  - name: isort
    image: abakus/lego-testbase:python3.11
    when:
      event: push
    environment:
      LANG: C.UTF-8
    depends_on:
      - setup
    commands:
      - pip install -q uv==0.11.6
      - uv run --frozen --only-group formatting isort -c lego

  - name: flake8
    image: abakus/lego-testbase:python3.11
    when:
      event: push
    environment:
      LANG: C.UTF-8
    depends_on:
      - setup
    commands:
      - pip install -q uv==0.11.6
      - uv run --frozen --only-group flake8 flake8

  - name: black
    image: abakus/lego-testbase:python3.11
    pull: true
    when:
      event: push
    environment:
      LANG: C.UTF-8
    depends_on:
      - setup
    commands:
      - pip install -q uv==0.11.6
      - uv run --frozen --only-group formatting black --check lego

  - name: mypy
    image: abakus/lego-testbase:python3.11
    pull: true
    when:
      event: push
    environment:
      LANG: C.UTF-8
      DJANGO_SETTINGS_MODULE: lego.settings
      PYTHONPATH: /drone/src
    depends_on:
      - setup
    commands:
      - pip install -q uv==0.11.6
      - uv run --frozen --group coverage --group mypy --group docs --group prod mypy .
    failure: ignore

  - name: docs
    image: abakus/lego-testbase:python3.11
    when:
      event: push
    environment:
      LANG: C.UTF-8
      PYTHONPATH: /drone/src:/drone/src/docs
    depends_on:
      - setup
    commands:
      - pip install -q uv==0.11.6
      - cd docs && uv run --frozen --project /drone/src --no-default-groups --group docs
        sphinx-build -T -b html -d _build/doctrees . _build/html

  - name: coverage
    image: abakus/lego-testbase:python3.11
    when:
      event: push
    environment:
      LANG: C.UTF-8
      CACHE: cache
      CODECOV_TOKEN:
        from_secret: codecov_token
    depends_on:
      - tests
    commands:
      - pip install -q uv==0.11.6
      - uv run --frozen --only-group coverage coverage combine
      - uv run --frozen --only-group coverage coverage report --fail-under=75
      - uv run --frozen --only-group coverage coverage xml
      # Upload coverage to Codecov
      - codecov -t ${CODECOV_TOKEN} -f "coverage.xml"

  - name: docker
    image: plugins/docker
    when:
      branch:
        - build
      status: success
      event: push
    depends_on:
      - missing-migrations
      - tests
      - isort
      - flake8
      - black
      - mypy
      - docs
      - coverage
    environment:
      SENTRY_AUTH_TOKEN:
        from_secret: sentry_auth_token
    settings:
      registry: https://registry.webkom.dev
      repo: registry.webkom.dev/webkom/lego
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      tags:
        - version-${DRONE_COMMIT_SHA:0:7}
        - latest
      build_args:
        - RELEASE=version-${DRONE_COMMIT_SHA:0:7}
        - SENTRY_ORG=abakus
        - SENTRY_PROJECT=lego
      build_args_from_env:
        - SENTRY_AUTH_TOKEN

  - name: Deploy
    image: abakus/ansible-deploy
    settings:
      playbook: /infrastructure/lego/playbooks/deploy.yml
      repository:
        from_secret: infra_repository
      tags:
        - lego
        - ci
      limit: ${DRONE_DEPLOY_TO}
      extra_vars: lego_version=version-${DRONE_COMMIT_SHA:0:7}
      inventory: /infrastructure/inventory
      vault_password:
        from_secret: ansible_vault_password
      private_key:
        from_secret: infra_deploy_key
    when:
      event:
        - promote
        - rollback
      branch:
        - build

services:
  - name: database
    image: postgres:17
    environment:
      POSTGRES_USER: lego
      POSTGRES_HOST_AUTH_METHOD: trust
  - name: cache
    image: redis
